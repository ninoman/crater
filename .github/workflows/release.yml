# Keeps a release PR open on main. Merging it tags a release, which builds the
# extension for Chrome and Firefox and attaches the zips to the GitHub release. They are
# uploaded to the Chrome Web Store and AMO by hand; see docs/releasing.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Back-to-back merges to main would otherwise race on the release PR branch.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Takes the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:firefox
      - run: pnpm lint:firefox

      - name: Zip the builds and the source
        run: |
          (cd dist && zip -r "../crater-$TAG.zip" .)
          (cd dist-firefox && zip -r "../crater-$TAG-firefox.zip" .)
          git archive --format=zip -o "crater-$TAG-source.zip" HEAD

      - name: Attach the zips to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "crater-$TAG.zip" "crater-$TAG-firefox.zip" "crater-$TAG-source.zip"

